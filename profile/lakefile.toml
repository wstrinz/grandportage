name = "gp_profile"
version = "0.1.0"
defaultTargets = ["GPProfile", "gp_profile_layout", "gp_reach_slice"]

# Executable algebraic profile (Addendum A §2.5e): Kernel plus Mathlib-free Hex libraries.
# F_p replay is exact rational replay with mod-p residuals, not HexModArith (A3 deviation, Will 2026-10-02).
# HexMvPoly v0.9.0 requires HexModArith and HexArith, so their C code (built with `cc`) is linked; GP calls neither.
# Mathlib must never appear in this package's dependency graph.

[[require]]
name = "gp_kernel"
path = "../phase2/lean"

[[require]]
name = "HexMvPoly"
git = "https://github.com/leanprover/hex-mv-poly.git"
rev = "v0.9.0"

[[lean_lib]]
name = "GPProfile"
globs = ["GPProfile", "GPProfile.Real.+", "GPProfile.LaneP.+"]

[[lean_exe]]
name = "gp_profile_layout"
root = "GPProfile.Layout"

[[lean_exe]]
name = "gp_reach_slice"
root = "GPProfile.Slice"

[[lean_exe]]
name = "gp_corpus_run"
root = "GPProfile.CorpusMain"

# The 3P campaign ledger runner behind `tools/gp.py` (post-G3a §4.6).
[[lean_exe]]
name = "gp_ledger"
root = "GPProfile.Ledger"

[[lean_exe]]
name = "gp_corpus_3b"
root = "GPProfile.Real.CorpusMain"

# The 3b part of a campaign ledger behind `tools/gp.py` (Phase 5 preparation).
[[lean_exe]]
name = "gp_ledger3"
root = "GPProfile.Real.Ledger3Main"

# Lane P (GP 0.52 P1): the P ledger runner, and the P binder (Lean core only; run inside a campaign
# package with `lake env`, it imports the package's modules and elaborates nothing).
[[lean_exe]]
name = "gp_ledgerp"
root = "GPProfile.LaneP.Run"

[[lean_exe]]
name = "gp_bindp"
root = "GPProfile.LaneP.Binder"
