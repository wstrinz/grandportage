name = "gp_profile"
version = "0.1.0"
defaultTargets = ["GPProfile", "gp_profile_layout", "gp_reach_slice"]

# Executable algebraic profile (Addendum A §2.5e): Kernel plus Mathlib-free Hex libraries.
# F_p replay uses core `Fin p` instead of HexModArith (A3 deviation, Will 2026-10-02): the
# HexModArith FFI needs `cc` and gmp.h, which this Windows toolchain lacks.
# Mathlib must never appear in this package's dependency graph.

[[require]]
name = "gp_kernel"
path = "../phase2/lean"

[[require]]
name = "HexMvPoly"
git = "https://github.com/leanprover/hex-mv-poly.git"
rev = "v0.6.0"

[[lean_lib]]
name = "GPProfile"

[[lean_exe]]
name = "gp_profile_layout"
root = "GPProfile.Layout"

[[lean_exe]]
name = "gp_reach_slice"
root = "GPProfile.Slice"

[[lean_exe]]
name = "gp_corpus_run"
root = "GPProfile.Corpus"
