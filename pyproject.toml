[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grandportage"
version = "0.4.1"
description = "Transport typing and obstruction tracking for computational algebra"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
gp = "grandportage.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["grandportage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
