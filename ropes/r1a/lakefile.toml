name = "r1a"
version = "0.1.0"
defaultTargets = ["UDGRope", "R1aChallenge"]

# Rope R1a: pinned to the current Mathlib release (v4.34.1, 2026-09-24), independently of GP's toolchain.

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "UDGRope"
globs = ["UDGRope", "UDGRope.+"]

[[lean_lib]]
name = "R1aChallenge"
globs = ["R1aChallenge.+"]

[[lean_lib]]
name = "R1aControl"
globs = ["R1aControl.+"]
