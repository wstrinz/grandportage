fidelity:
  divergences: >-
    formal-conjectures' definitions are copied verbatim under namespace UDGRope
    rather than imported, so equality with FC's constants is textual, not proved.
    The rhombus lemma is stated for vertices a != c, b != d of an injective
    embedding, as in PROOFS.md, which invokes injectivity explicitly. FC's
    constants live in namespace Erdos90 (unitDistNum at the root) and FC pins
    Mathlib v4.33.1 while this rope uses v4.34.1, so the match with FC is
    textual, up to renamed constants. See FIDELITY.md.

