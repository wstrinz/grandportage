version: "v0.4"

project:
  name: "R1a: rhombus lemma, six totally unfaithful gadgets, heredity and Schade averaging for planar unit-distance graphs"
  description: >-
    Lemmas used in exact computations of u(n), the maximum number of unit
    distances among n points in the Euclidean plane. (1) Rhombus lemma: in an
    injective unit-distance embedding of a graph into EuclideanSpace R (Fin 2),
    every 4-cycle a-b-c-d satisfies p a - p b + p c - p d = 0. (2) Six totally
    unfaithful (TU) gadgets, the five of Globus-Parshall and the sixth of
    Alexeev-Mixon-Parshall as listed in artwaste's data/tu-gadgets.json: in
    every injective unit-distance embedding the distinguished non-adjacent pair
    is at distance 1. (3) Heredity: unit-distance embeddability passes to
    subgraph copies (Mathlib's UnitDistEmbedding.copy). (4) Schade averaging
    over formal-conjectures' maxUnitDistances: u(n) <= floor(n u(n-1)/(n-2))
    for n >= 3. (5) Non-vacuity of (2): each gadget has an injective
    unit-distance embedding with exact coordinates in Q(sqrt 3), taken from
    PROOFS.md's diagrams D0-D2, and the distinguished pair is at distance 1 in
    it. The fifteen main theorems depend on propext, Classical.choice and
    Quot.sound only. The only sorries are the deliberate placeholders in each
    Comparator challenge and in the controls R1aControl/SorryGadget0 and
    R1aControl/SorryEmbeds, which Comparator must refuse.
  authors:
    - "Grand Portage builder and campaign agents (Claude models; see automation)"
  license: "Apache-2.0"

