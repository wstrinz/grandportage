fidelity:
  divergences: >-
    formal-conjectures' definitions are copied verbatim under namespace UDGRope
    rather than imported, so equality with FC's constants is textual, not proved.
    The rhombus lemma is stated for vertices a != c, b != d of an injective
    embedding, as in PROOFS.md, which invokes injectivity explicitly. FC's
    constants live in namespace Erdos90 (unitDistNum at the root) and FC pins
    Mathlib v4.33.1 while this rope uses v4.34.1, so the match with FC is
    textual, up to renamed constants. Gadget 4 is gadget 3's graph with another
    pair, so gadget4_embeds has gadget3_embeds's statement. See FIDELITY.md.

review:
  status: "agent-reviewed"
  notes: "Self-assessed by the assembling agent (FIDELITY.md), then reviewed at gate GR1 by a non-builder agent: all 9 statements faithful, no statement defects (2026-10-10). The six gadget-existence theorems (release item D2, 2026-10-12) are self-assessed only. No human review."

